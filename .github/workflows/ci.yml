# KAI CI — runs the unit/integration suite on every push/PR.
# These tests use fakes + validation-only constructors, so they need NEITHER
# Ollama, a live Postgres, nor torch (the reranker import is lazy) — CI stays fast.
# The LIVE accuracy gate (eval/run_eval.py, the 61-Q golden set) needs Ollama + a
# seeded pgvector DB, so it runs locally/nightly, not here — see doc/ for how.
name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core deps (no torch/Ollama needed for the suite)
        run: |
          python -m pip install -U pip
          pip install fastapi "uvicorn" "pydantic>=2" pydantic-settings httpx "psycopg[binary]>=3" pgvector numpy pypdf pytest
      - name: Run tests
        run: python -m pytest -q tests/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the production image so the Docker/Compose path has real coverage
      # (build only — no live DB/models needed to prove it packages + installs).
      - name: Build the KAI image
        run: docker build -t kai:ci .
