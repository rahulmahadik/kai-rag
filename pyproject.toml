[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kai-rag"
version = "1.0.0"
description = "KAI — a self-hosted, grounded knowledge assistant for your team's docs that answers with citations and never guesses."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rahul Mahadik" }]
keywords = ["rag", "knowledge-base", "confluence", "pgvector", "chatbot", "self-hosted"]
# Minimum floors are recent, tested baselines (the suite is green against the current
# latest of each). They're `>=` ranges, not pins, so you still get the newest patches.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]
# chat surface (Webex websocket bot) — kept optional so the core API stays light
bot = ["webex_bot>=1.2"]
# Slack chat surface (CHAT_PLATFORM=slack)
slack = ["slack_bolt>=1.18"]
# Microsoft Teams chat surface (CHAT_PLATFORM=teams) — inbound Bot Framework webhook;
# pyjwt validates the inbound bot token (FastAPI/uvicorn/httpx are already core deps).
teams = ["pyjwt[crypto]>=2.8"]
# cross-encoder reranker (RERANKER=cross_encoder)
rerank = ["sentence-transformers>=3.0"]

[project.urls]
Homepage = "https://rahulmahadik.com"
Author = "https://technoscripts.com"

[tool.setuptools.packages.find]
include = ["kai*"]

[tool.pytest.ini_options]
# Keep a bare `pytest` fast and green: only collect tests/, never the gitignored
# internal/ scratch or eval/ harnesses.
testpaths = ["tests"]
norecursedirs = ["internal", "eval", ".venv", "build", "dist", "release"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["internal", ".venv"]
